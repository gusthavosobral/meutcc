<script type="module"> 

 // ----------------------------------------------> API CIDADES <---------------------------------------------------- //

let cidadesCache = null;

async function buscarCidades(query) 

{       
        if(cidadesCache===null)
        {
        const response = await fetch('https://servicodados.ibge.gov.br/api/v1/localidades/municipios');
        cidadesCache = await response.json();
        }
        
        return cidadesCache.filter(city => 
        city.nome.toLowerCase().includes(query.toLowerCase())).slice(0, 8);
}
        


//-------------------------------------------- Função para selecionar cidade------------------------------------//
function selectCity(cityName)
{  
    document.getElementById('location').value = cityName;
    document.getElementById('sugestões').style.display = 'none';
}
window.selectCity = selectCity;
//---------------------------------------------------------------------------------------------------------------//

//---------------------------------------------MANIPULAÇÃO HTML--------------------------------------------------//

document.addEventListener('DOMContentLoaded', function() {
    const lugarInput = document.getElementById('location');
    const sugestoes = document.getElementById('sugestões');

    lugarInput.addEventListener('input', async function() {
        const textoDigitado = this.value.trim();
    
        if (textoDigitado.length < 3) {
            sugestoes.innerHTML = '';
            sugestoes.style.display = 'none';
            return;
        }
        
        try {
            const filteredCities = await buscarCidades(textoDigitado);       
            
            if (filteredCities.length === 0) {
                sugestoes.innerHTML = '<div>Nenhuma cidade encontrada<div>';
                sugestoes.style.display = 'block';
                return;
            }
            
            let html = '';
            for(var city of filteredCities)
            {   
                const cityName = city.nome;
                const stateCode = city.microrregiao.mesorregiao.UF.sigla;
                const fullName = `${cityName}, ${stateCode}`;

               html += `<div onclick="selectCity('${fullName}')">
                            ${cityName}, ${stateCode}
                         </div>`;}
            
            sugestoes.innerHTML = html;
            sugestoes.style.display = 'block';
            
        } catch (error) {
            console.log('Erro ao buscar cidades:', error);
            sugestoes.innerHTML = '<div>Erro ao carregar cidades</div>';
            sugestoes.style.display = 'block';
        }
    });

    document.addEventListener('click', function(e) {
        if (!lugarInput.contains(e.target) && !sugestoes.contains(e.target)) {
            sugestoes.style.display = 'none';
        }
    });
});

//------------------------------------------------------------------------------------------------------------------//

//------------------------------------------------------------------------------------------------------------------//
</script>
