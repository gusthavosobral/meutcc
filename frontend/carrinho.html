<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Carrinho - GSobralPetHub</title>
    <link rel="stylesheet" href="carrinho.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="header">
    <a href="gsobralpethubpaginainicial.html" class="back-btn">
      ← Voltar
    </a>
    <div class="logo">GSobralPetHub</div>
  </header>

  <div class="cart-container">
    <h1 class="page-title">Meu Carrinho</h1>
    <div id="cartContent" class="loading">Carregando carrinho...</div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.8.0/+esm";
    
    const SUPABASE_URL = "https://kdlhsjtaasqyitrwgawt.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkbGhzanRhYXNxeWl0cndnYXd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY1ODE0MDksImV4cCI6MjA3MjE1NzQwOX0.xFWJvebljTI334zzD1HeBDT0N2iqn4K8w77ak_GwG14";
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    loadCart();

    async function loadCart() {
      try {
        const { data: produtos, error } = await client
          .from("produto")
          .select("*, usuario:idusuario(nomeUsuario)")
          .eq("carrinho", true);

        if (error) {
          console.error("Erro ao carregar carrinho:", error);
          document.getElementById('cartContent').innerHTML = `
            <div class="empty-cart">
              <div class="empty-cart-icon">⚠️</div>
              <p class="empty-cart-text">Erro ao carregar carrinho</p>
            </div>
          `;
          return;
        }

        if (!produtos || produtos.length === 0) {
          document.getElementById('cartContent').innerHTML = `
            <div class="empty-cart">
              <div class="empty-cart-icon">🛒</div>
              <p class="empty-cart-text">Seu carrinho está vazio</p>
              <a href="gsobralpethubpaginainicial.html" class="btn-primary">Continuar Comprando</a>
            </div>
          `;
          return;
        }

        // Calcular total
        const total = produtos.reduce((sum, p) => sum + parseFloat(p.preco), 0);

        document.getElementById('cartContent').innerHTML = `
          <div class="cart-items">
            ${produtos.map(produto => `
              <div class="cart-item">
                <div class="item-image">
                  ${produto.fotoproduto 
                    ? `<img src="${produto.fotoproduto}" alt="${produto.nome}">` 
                    : '<div class="no-image">📦</div>'}
                </div>
                <div class="item-info">
                  <div class="item-name">${produto.nome}</div>
                  <div class="item-description">${produto.descricao || 'Sem descrição'}</div>
                  <div class="item-seller">Vendido por: ${produto.usuario?.nomeUsuario || 'Não informado'}</div>
                </div>
                <div class="item-actions">
                  <div class="item-price">R$ ${parseFloat(produto.preco).toFixed(2)}</div>
                  <div class="btn-group">
                    <a href="produto-detalhes.html?id=${produto.id}" class="btn-view">Ver Produto</a>
                    <button class="btn-remove" onclick="removeFromCart(${produto.id})">Remover</button>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="cart-summary">
            <div class="summary-row">
              <span>Subtotal (${produtos.length} ${produtos.length === 1 ? 'item' : 'itens'})</span>
              <span>R$ ${total.toFixed(2)}</span>
            </div>
            <div class="summary-row">
              <span>Total</span>
              <span>R$ ${total.toFixed(2)}</span>
            </div>
            <a href="finalizar-carrinho.html" class="btn-checkout">
              Finalizar Compra
            </a>
          </div>
        `;

      } catch (erro) {
        console.error("Erro:", erro);
        document.getElementById('cartContent').innerHTML = `
          <div class="empty-cart">
            <div class="empty-cart-icon">⚠️</div>
            <p class="empty-cart-text">Erro inesperado ao carregar carrinho</p>
          </div>
        `;
      }
    }

    window.removeFromCart = async function(productId) {
      if (!confirm('Deseja remover este produto do carrinho?')) {
        return;
      }

      try {
        const { error } = await client
          .from('produto')
          .update({ carrinho: false })
          .eq('id', productId);

        if (error) {
          console.error('Erro ao remover produto:', error);
          alert('Erro ao remover produto do carrinho!');
          return;
        }

        alert('Produto removido do carrinho!');
        loadCart(); // Recarregar carrinho

      } catch (erro) {
        console.error('Erro:', erro);
        alert('Erro ao processar solicitação!');
      }
    };
  </script>
</body>
</html>
