<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Carrinho - GSobralPetHub</title>
    <link rel="stylesheet" href="carrinho.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  
  <header class="header">
    <a href="gsobralpethubpaginainicial.html" class="back-btn">
      ← Voltar
    </a>
    <div class="logo">GSobralPetHub</div>
  </header>

  <div class="cart-container">
    <h1 class="page-title">Meu Carrinho</h1>
    <div id="cartContent" class="loading">Carregando carrinho...</div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.8.0/+esm";
    
    const SUPABASE_URL = "https://kdlhsjtaasqyitrwgawt.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkbGhzanRhYXNxeWl0cndnYXd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY1ODE0MDksImV4cCI6MjA3MjE1NzQwOX0.xFWJvebljTI334zzD1HeBDT0N2iqn4K8w77ak_GwG14";
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // PEGA O EMAIL DO USUÁRIO LOGADO
    const emailLogado = localStorage.getItem('email');
    
    if (!emailLogado) {
      document.getElementById('cartContent').innerHTML = `
        <div class="empty-cart">
          <div class="empty-cart-icon">⚠️</div>
          <p class="empty-cart-text">Você precisa estar logado para ver o carrinho</p>
          <a href="login.html" class="btn-primary">Fazer Login</a>
        </div>
      `;
    } else {
      inicializarCarrinho();
    }

    async function inicializarCarrinho() {
      try {
        console.log('Email logado:', emailLogado);
        
        // Busca o usuário pelo email para pegar o ID
        const { data: usuario, error: erroUsuario } = await client
          .from('usuario')
          .select('id')
          .eq('email', emailLogado)
          .single();

        if (erroUsuario || !usuario) {
          console.error('Erro ao buscar usuário:', erroUsuario);
          document.getElementById('cartContent').innerHTML = `
            <div class="empty-cart">
              <div class="empty-cart-icon">⚠️</div>
              <p class="empty-cart-text">Usuário não encontrado</p>
              <a href="login.html" class="btn-primary">Fazer Login Novamente</a>
            </div>
          `;
          return;
        }

        console.log('ID do usuário:', usuario.id);

        // Agora que temos o ID, carrega o carrinho
        loadCart(usuario.id);

      } catch (erro) {
        console.error('Erro ao inicializar:', erro);
        document.getElementById('cartContent').innerHTML = `
          <div class="empty-cart">
            <div class="empty-cart-icon">⚠️</div>
            <p class="empty-cart-text">Erro ao carregar carrinho</p>
          </div>
        `;
      }
    }

    async function loadCart(userId) {
      try {
        console.log('Carregando carrinho para usuário:', userId);
        
        // Busca TODOS os produtos com carrinho = true
        const { data: todosProdutos, error } = await client
          .from("produto")
          .select("*, usuario:idusuario(nomeUsuario)")
          .eq("carrinho", true);

        if (error) {
          console.error("Erro ao carregar produtos:", error);
          document.getElementById('cartContent').innerHTML = `
            <div class="empty-cart">
              <div class="empty-cart-icon">⚠️</div>
              <p class="empty-cart-text">Erro ao carregar carrinho: ${error.message}</p>
            </div>
          `;
          return;
        }

        console.log('Todos os produtos com carrinho=true:', todosProdutos);

        // Filtra manualmente os produtos que contém o ID do usuário no array idcomprador
        const produtos = todosProdutos.filter(produto => {
          const compradores = produto.idcomprador || [];
          console.log(`Produto ${produto.id} - Compradores:`, compradores);
          // Verifica se o array contém o userId (como número ou string)
          return compradores.includes(userId) || compradores.includes(String(userId));
        });

        console.log('Produtos filtrados para este usuário:', produtos);

        if (!produtos || produtos.length === 0) {
          document.getElementById('cartContent').innerHTML = `
            <div class="empty-cart">
              <div class="empty-cart-icon">🛒</div>
              <p class="empty-cart-text">Seu carrinho está vazio</p>
              <a href="gsobralpethubpaginainicial.html" class="btn-primary">Continuar Comprando</a>
            </div>
          `;
          return;
        }

        const total = produtos.reduce((sum, p) => sum + parseFloat(p.preco), 0);

        document.getElementById('cartContent').innerHTML = `
          <div class="cart-items">
            ${produtos.map(produto => `
              <div class="cart-item">
                <div class="item-image">
                  ${produto.fotoproduto 
                    ? `<img src="${produto.fotoproduto}" alt="${produto.nome}">` 
                    : '<div class="no-image">📦</div>'}
                </div>
                <div class="item-info">
                  <div class="item-name">${produto.nome}</div>
                  <div class="item-description">${produto.descricao || 'Sem descrição'}</div>
                  <div class="item-seller">Vendido por: ${produto.usuario?.nomeUsuario || 'Não informado'}</div>
                </div>
                <div class="item-actions">
                  <div class="item-price">R$ ${parseFloat(produto.preco).toFixed(2)}</div>
                  <div class="btn-group">
                    <a href="produto-detalhes.html?id=${produto.id}" class="btn-view">Ver Produto</a>
                    <button class="btn-remove" onclick="removeFromCart(${produto.id}, ${userId})">Remover</button>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="cart-summary">
            <div class="summary-row">
              <span>Subtotal (${produtos.length} ${produtos.length === 1 ? 'item' : 'itens'})</span>
              <span>R$ ${total.toFixed(2)}</span>
            </div>
            <div class="summary-row">
              <span>Total</span>
              <span>R$ ${total.toFixed(2)}</span>
            </div>
            <a href="finalizar-carrinho.html" class="btn-checkout">
              Finalizar Compra
            </a>
          </div>
        `;

      } catch (erro) {
        console.error("Erro:", erro);
        document.getElementById('cartContent').innerHTML = `
          <div class="empty-cart">
            <div class="empty-cart-icon">⚠️</div>
            <p class="empty-cart-text">Erro inesperado: ${erro.message}</p>
          </div>
        `;
      }
    }

    window.removeFromCart = async function(productId, userId) {
      if (!confirm('Deseja remover este produto do carrinho?')) {
        return;
      }

      try {
        console.log('Removendo produto:', productId, 'para usuário:', userId);
        
        // Busca o produto atual para pegar o array de compradores
        const { data: produto, error: erroGet } = await client
          .from('produto')
          .select('idcomprador, carrinho')
          .eq('id', productId)
          .single();

        if (erroGet) {
          console.error('Erro ao buscar produto:', erroGet);
          alert('Erro ao remover produto do carrinho!');
          return;
        }

        console.log('Produto antes da remoção:', produto);

        // Remove o ID do usuário do array
        let compradores = produto.idcomprador || [];
        compradores = compradores.filter(id => {
          // Compara tanto como número quanto string
          return String(id) !== String(userId) && Number(id) !== Number(userId);
        });

        console.log('Compradores após remoção:', compradores);

        // Atualiza o produto
        const { error } = await client
          .from('produto')
          .update({ 
            idcomprador: compradores,
            carrinho: compradores.length > 0 // Se não tem mais ninguém, marca como false
          })
          .eq('id', productId);

        if (error) {
          console.error('Erro ao atualizar produto:', error);
          alert('Erro ao remover produto do carrinho!');
          return;
        }

        alert('Produto removido do carrinho!');
        loadCart(userId);

      } catch (erro) {
        console.error('Erro:', erro);
        alert('Erro ao processar solicitação!');
      }
    };
  </script>
</body>
</html>
