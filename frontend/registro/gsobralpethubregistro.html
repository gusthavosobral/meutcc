<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSobral Pethub</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="gsobralpethubregistro.css">
</head>
<body>
  <div class="container">
        <div class="register-card">
            <div class="moon-accent"></div>
            <div class="crescent"></div>
            
            <div class="logo-section">
                <h1 class="logo">GSobralPetHub</h1>
                <p class="tagline">Junte-se à nossa comunidade</p>
            </div>

            <form class="register-form" id="registerForm">
                <div class="form-group">
                    <label class="form-label" for="email">E-mail</label>
                    <input type="email" id="email" class="form-input" placeholder="Digite seu e-mail" required>
                </div>

                <div class="form-group" style="position: relative;">
                    <label class="form-label" for="senha1">Senha</label>
                    <input type="password" id="senha1" class="form-input" placeholder="Crie uma senha segura" required>
                    <i class="fas fa-eye password-toggle" onclick="togglePassword('senha1', this)"></i>
                    <div class="password-strength" id="passwordStrength"></div>
                </div>

                <div class="form-group" style="position: relative;">
                    <label class="form-label" for="senha2">Confirmar Senha</label>
                    <input type="password" id="senha2" class="form-input" placeholder="Confirme sua senha" required>
                    <i class="fas fa-eye password-toggle" onclick="togglePassword('senha2', this)"></i>
                    <div class="password-match" id="passwordMatch"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Tipo de Usuário</label>
                    <div class="user-type-options">
                        <div class="user-type-option" data-value="petsitter">
                            <i class="fas fa-heart"></i>
                            <span>Pet Sitter</span>
                        </div>
                        <div class="user-type-option" data-value="ong">
                            <i class="fas fa-hands-helping"></i>
                            <span>ONG</span>
                        </div>
                        <div class="user-type-option" data-value="veterinario">
                            <i class="fas fa-user-md"></i>
                            <span>Veterinário</span>
                        </div>
                        <div class="user-type-option" data-value="doador">
                            <i class="fas fa-gift"></i>
                            <span>Doador</span>
                        </div>
                        <div class="user-type-option" data-value="adotador">
                            <i class="fas fa-home"></i>
                            <span>Adotador</span>
                        </div>
                        <div class="user-type-option" data-value="cliente">
                            <i class="fas fa-user"></i>
                            <span>Cliente</span>
                        </div>
                        <div class="user-type-option" data-value="petshop">
                            <i class="fas fa-store"></i>
                            <span>Pet Shop</span>
                        </div>
                    </div>
                    <input type="hidden" id="tipousuario" name="tipousuario" required>
                </div>

                <button type="submit" class="register-btn">Criar Conta</button>
            </form>

            <div class="login-link">
                Já tem conta? <a href="../login/gsobralpethublogin.html">Fazer login</a>
            </div>
        </div>
    </div>

<script type="module">
    // ===================== BANCO DE DADOS =====================
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.8.0/+esm";

    const SUPABASE_URL = "https://kdlhsjtaasqyitrwgawt.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkbGhzanRhYXNxeWl0cndnYXd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY1ODE0MDksImV4cCI6MjA3MjE1NzQwOX0.xFWJvebljTI334zzD1HeBDT0N2iqn4K8w77ak_GwG14";

    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ===================== FUNÇÕES DE SENHA =====================
    async function gerarHashSHA256(texto) {
        const encoder = new TextEncoder();
        const data = encoder.encode(texto);
        const hashBuffer = await crypto.subtle.digest("SHA-256", data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
    }

    function validarForcaSenha(senha) {
        let pontos = 0;
        let feedback = [];

        if (senha.length >= 8) pontos += 1;
        else feedback.push("8+ caracteres");

        if (/[a-z]/.test(senha)) pontos += 1;
        else feedback.push("letra minúscula");

        if (/[A-Z]/.test(senha)) pontos += 1;
        else feedback.push("letra maiúscula");

        if (/[0-9]/.test(senha)) pontos += 1;
        else feedback.push("número");

        if (/[^a-zA-Z0-9]/.test(senha)) pontos += 1;
        else feedback.push("símbolo");

        return { pontos, feedback };
    }

    // ===================== VERIFICAÇÃO DE EMAIL =====================
    async function verificarEmailExiste(email) {
        try {
            const { data, error } = await client
                .from('usuario')
                .select('email')
                .eq('email', email)
                .single();
            
            return data !== null && !error; //ACHOU O E-MAIL, DATA NÃO VAI SER NULL, CATCH NÃOEXECUTA
        } catch (error) {
            console.log('Email não encontrado, pode prosseguir');
            return false;
        }
    }

    // ===================== ALERT PERSONALIZADO =====================
    function showAlert(message, type = 'success') {
        const alert = document.createElement('div');
        alert.className = `custom-alert ${type}`;
        alert.textContent = message;
        document.body.appendChild(alert);

        setTimeout(() => alert.classList.add('show'), 100);
        
        setTimeout(() => {
            alert.classList.remove('show');
            setTimeout(() => document.body.removeChild(alert), 300);
        }, 3000);
    }

    // ===================== VARIÁVEIS GLOBAIS =====================
    let tipoUsuarioSelecionado = '';

    // ===================== EVENTOS DO DOM =====================
    document.addEventListener('DOMContentLoaded', function() {
        
        // ===================== SELEÇÃO DE TIPO DE USUÁRIO =====================
        document.querySelectorAll('.user-type-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.user-type-option').forEach(opt => {
                    opt.classList.remove('selected');
                });
                this.classList.add('selected');
                tipoUsuarioSelecionado = this.getAttribute('data-value');
                document.getElementById('tipousuario').value = tipoUsuarioSelecionado;
            });
        });

        // ===================== VALIDAÇÃO SENHA EM TEMPO REAL =====================
        document.getElementById('senha1').addEventListener('input', function() {
            const senha = this.value;
            const strengthDiv = document.getElementById('passwordStrength');
            
            if (senha.length === 0) {
                strengthDiv.textContent = '';
                return;
            }

            const { pontos, feedback } = validarForcaSenha(senha);
            
            if (pontos <= 2) {
                strengthDiv.textContent = `Fraca - Adicione: ${feedback.join(', ')}`;
                strengthDiv.style.color = '#ef4444';
            } else if (pontos <= 3) {
                strengthDiv.textContent = `Média - Adicione: ${feedback.join(', ')}`;
                strengthDiv.style.color = '#f59e0b';
            } else if (pontos <= 4) {
                strengthDiv.textContent = `Forte - Quase lá! - Adicione: ${feedback.join(', ')}`;
                strengthDiv.style.color = '#10b981';
            } else {
                strengthDiv.textContent = 'Muito forte - Excelente!';
                strengthDiv.style.color = '#059669';
            }
        });

        // ===================== VALIDAÇÃO CONFIRMAÇÃO DE SENHA =====================
        document.getElementById('senha2').addEventListener('input', function() {
            const senha1 = document.getElementById('senha1').value;
            const senha2 = this.value;
            const matchDiv = document.getElementById('passwordMatch');
            
            if (senha2.length === 0) {
                matchDiv.textContent = '';
                matchDiv.className = 'password-match';
                return;
            }

            if (senha1 === senha2) {
                matchDiv.textContent = '✓ Senhas coincidem';
                matchDiv.className = 'password-match valid';
            } else {
                matchDiv.textContent = '✗ Senhas não coincidem';
                matchDiv.className = 'password-match invalid';
            }
        });

        // ===================== ANIMAÇÕES NOS INPUTS =====================
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'translateY(-2px)';
                this.parentElement.style.transition = 'transform 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'translateY(0)';
            });
        });

        // ===================== ENVIO DO FORMULÁRIO =====================
        document.getElementById("registerForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            
            const btn = document.querySelector('.register-btn');
            const email = document.getElementById("email").value.trim();
            const senha1 = document.getElementById("senha1").value;
            const senha2 = document.getElementById("senha2").value;
            const tipo = document.getElementById("tipousuario").value.trim();
            const forcasenha = validarForcaSenha(senha1);
            
            // Validação de força da senha (exigindo 5 pontos)
            if(forcasenha.pontos < 5) {
                return;
            }

            // Validações básicas
            if (!email || !senha1 || !senha2 || !tipo) {
                showAlert("Dados incompletos", 'error');
                return;
            }

            if (senha1 !== senha2) {
                showAlert("Senhas diferentes", 'error');
                return;
            }

            // Estado de loading
            btn.classList.add('loading');
            btn.textContent = 'Criando conta...';
            btn.disabled = true;

            try {
                // Verificar se e-mail já existe
                const emailExiste = await verificarEmailExiste(email);
                if (emailExiste) {
                    throw new Error('Este e-mail já está cadastrado');
                }

                // Gerar hash da senha
                const hash = await gerarHashSHA256(senha1);

                // Registrar usuário
                console.log('Iniciando registro...', { email, tipo });
                
                const { data, error } = await client
                    .from("usuario")
                    .insert([{ email, senha: hash, tipousuario: tipo }])
                    .select();

                if (error) {
                    console.error("Erro:", error);
                    throw new Error("Erro ao registrar. Verifique os dados.");
                }

                console.log('Usuário criado:', data[0]);
                showAlert("Registro realizado com sucesso!", 'success');
                
                // Limpar formulário
                document.getElementById("registerForm").reset();
                document.querySelectorAll('.user-type-option').forEach(opt => {
                    opt.classList.remove('selected');
                });
                document.getElementById('passwordStrength').textContent = '';
                document.getElementById('passwordMatch').textContent = '';
                tipoUsuarioSelecionado = '';
                
                // Redirecionar após 2 segundos
                setTimeout(() => {
                    goToLogin();
                }, 2000);

            } catch (error) {
                console.error('Erro ao criar conta:', error);
                
                let errorMessage = 'Erro ao criar conta. Tente novamente.';
                
                if (error.message.includes('duplicate key') || error.code === '23505') {
                    errorMessage = 'Este e-mail já está cadastrado.';
                } else if (error.message.includes('violates not-null constraint')) {
                    errorMessage = 'Todos os campos são obrigatórios.';
                } else if (error.message) {
                    errorMessage = error.message;
                }
                
                showAlert(errorMessage, 'error');
                
            } finally {
                // Restaurar botão
                btn.classList.remove('loading');
                btn.textContent = 'Criar Conta';
                btn.disabled = false;
            }
        });

    });

    // ===================== FUNÇÕES GLOBAIS =====================
    window.togglePassword = function(inputId, icon) {
        const input = document.getElementById(inputId);
        
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    };

    window.goToLogin = function() {
        showAlert('Redirecionando para página de login...', 'success');
        window.location.href = '../login/gsobralpethublogin.html';
    };

</script>
